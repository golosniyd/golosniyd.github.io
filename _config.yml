about_content: | # this will include new lines to allow paragraphs
  Привет, меня зовут Дмитрий и я работаю DevOps / Big Data Engineer.
  Основной фокус — проектирование, развёртывание и поддержка Big Data / Dataflow / Data Science инфраструктуры на базе Ansible, Docker, Kubernetes и Hadoop-экосистемы.
  Занимаюсь автоматизацией CI/CD, мониторингом, логированием, интеграциями безопасности (Keycloak, Kerberos, LDAP/AD, TLS/mTLS) и администрированием кластеров.


content:
  - title: Проекты
    layout: list
    content:
      - layout: top-middle
        title: Dataflow
        link: https://eastwind.ai/
        description: |
          Продукт для обработки и оркестрации больших данных в экосистеме Hadoop.
          Стек: Scala/SBT, Hadoop, Spark, YARN, Livy, Oozie, ActiveMQ, PostgreSQL, Jenkins.
          Сборка и деплой через SBT/Jenkins, запуск Spark/Oozie-джоб, интеграция с Kafka/RabbitMQ и S3-хранилищами.

      - layout: top-middle
        title: Data Science / Big Data Platform
        link: https://eastwind.ai/
        description: |
          Кластеры для аналитики и Data Science: Hadoop, Spark, YARN, Airflow, MLflow, Jupyter, ClickHouse, PostgreSQL HA (Pacemaker/Corosync), Redis, SeaweedFS, Apache Superset.
          Мониторинг и логирование на базе Prometheus, Grafana, Loki, Alertmanager, Alloy и экспортёров.

      - layout: top-middle
        title: AI-оркестратор
        link: https://eastwind.ai/
        description: |
          Проектирование оркестратора флота агентов на базе локальных LLM (3–9B параметров).
          Архитектура: ролевая маршрутизация задач с учётом VRAM/RAM/ролей, Redis Streams, Postgres, FastAPI, React + React Flow, LangGraph, Langfuse.
          Инференс-адаптеры: Ollama, vLLM, llama-server, SGLang; интеграция с opencode; мониторинг GPU/VRAM, трейсинг и отмена задач.

      - layout: top-middle
        title: AdConnect
        link: https://eastwind.ai/
        additional_links:
          - title: eastwind.ai
            icon: fas fa-globe
            url: https://eastwind.ai/
        description: |
          Платформа управления рекламными кампаниями. Инфраструктура включает .NET-микросервисы, React-фронтенды, PostgreSQL, ClickHouse, RabbitMQ, Redis, Keycloak, InfluxDB, Elasticsearch, Grafana.
          Автоматизация развёртывания и конфигурирования на Ansible.

  - title: Достижения
    layout: list
    content:
      - layout: top-middle
        description: |
          - Спроектировал архитектуру Big Data / Data Science S3-based platform: от выбора компонентов до сетевой топологии, DMZ и политик безопасности до участии в доработках open-source решений.
          - Внедрил security-интеграции: Keycloak с AD/LDAPS, Kerberos-аутентификация в Hadoop, TLS/mTLS между сервисами, управление секретами через Ansible Vault / HashiCorp Vault.
          - Спроектировал AI-оркестратор: маршрутизация задач между агентами на локальных LLM с учётом VRAM, ролей и приоритетов; трейсинг через Langfuse, мониторинг GPU/VRAM, интеграция с opencode.
          - Создал несколько работающих автоматизированных прототипов и довёл их до промышленного решения, внедрённого у телеком-операторов.
          - Поддерживаю более 170 прод-хостов и около 100 staging/lab/внутренних машин.

